name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Multi-Architecture Binaries
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" -o dist/frizzlabs-ddns-linux-amd64 ./cmd/frizzlabs-ddns
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" -o dist/frizzlabs-ddns-linux-arm64 ./cmd/frizzlabs-ddns
          GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" -o dist/frizzlabs-ddns-linux-armv7 ./cmd/frizzlabs-ddns
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" -o dist/frizzlabs-ddns-windows-amd64.exe ./cmd/frizzlabs-ddns
          GOOS=windows GOARCH=arm64 go build -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" -o dist/frizzlabs-ddns-windows-arm64.exe ./cmd/frizzlabs-ddns
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" -o dist/frizzlabs-ddns-darwin-amd64 ./cmd/frizzlabs-ddns
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" -o dist/frizzlabs-ddns-darwin-arm64 ./cmd/frizzlabs-ddns
          cd dist && sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
